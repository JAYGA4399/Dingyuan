<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定远之神 · 人生模拟器</title>
<style>
  :root{
    --gold:#f5c542;--gold2:#ffe9a8;--red:#ff5252;--cyan:#4dd0e1;--violet:#a78bfa;
    --bg:#070a14;--panel:rgba(18,24,44,.9);--line:rgba(245,197,66,.26);
    --text:#e9ecf7;--muted:#96a0c0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--text);background:
      radial-gradient(ellipse at 15% -5%, rgba(245,197,66,.16), transparent 42%),
      radial-gradient(ellipse at 88% 8%, rgba(167,139,250,.15), transparent 45%),
      radial-gradient(ellipse at 50% 108%, rgba(77,208,225,.12), transparent 55%),
      linear-gradient(180deg,#070a14,#0a1024 55%,#070a14);
    background-attachment:fixed;line-height:1.7;overflow-x:hidden;
    display:flex;flex-direction:column;min-height:100vh;
  }
  .serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif;}

  .shell{width:100%;max-width:900px;margin:0 auto;padding:28px 18px 40px;flex:1;display:flex;flex-direction:column;}

  /* 开始页 */
  .title-wrap{text-align:center;padding:26px 0 8px;}
  .eyebrow{display:inline-block;font-size:11.5px;letter-spacing:8px;color:var(--gold);
    border:1px solid var(--line);border-radius:20px;padding:4px 18px;background:rgba(245,197,66,.06);}
  h1{font-size:clamp(34px,7vw,60px);font-weight:900;letter-spacing:.12em;margin:16px 0 6px;
    background:linear-gradient(180deg,#fff8e1,#f5c542 50%,#a67c00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(245,197,66,.4));}
  .sub{color:var(--muted);font-size:14px;}

  .pick{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;}
  .pick .card{
    background:linear-gradient(160deg,rgba(23,31,62,.95),rgba(12,17,36,.96));
    border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;
    cursor:pointer;text-align:center;transition:transform .3s,border-color .3s,box-shadow .3s;
    display:flex;flex-direction:column;gap:10px;align-items:center;
  }
  .pick .card:hover{transform:translateY(-6px);border-color:rgba(245,197,66,.55);
    box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 26px rgba(245,197,66,.15);}
  .pick .card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;}
  .pick .card .nm{font-size:19px;font-weight:700;letter-spacing:.1em;color:#fff;}
  .pick .card .tg{font-size:11.5px;color:var(--gold2);letter-spacing:2px;}
  .pick .card .sc{font-size:11px;color:var(--muted);letter-spacing:1px;}

  .hint{margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px;}
  .hint b{color:var(--gold2);}

  /* 游戏页 */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .topbar img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid rgba(245,197,66,.6);}
  .topbar .who{flex:1;}
  .topbar .who h2{font-size:19px;letter-spacing:.1em;color:#fff;}
  .topbar .who p{font-size:12px;color:var(--muted);}
  .topbar .quit{font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,.16);
    border-radius:14px;padding:4px 12px;cursor:pointer;background:none;}
  .topbar .quit:hover{color:var(--gold2);border-color:var(--line);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .st{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;}
  .st .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .st .row b{color:#fff;font-size:13px;}
  .st .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;}
  .st .bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .st:nth-child(2) .bar i{background:linear-gradient(90deg,#4dd0e1,#b2ebf2);}
  .st:nth-child(3) .bar i{background:linear-gradient(90deg,#a78bfa,#ddd6fe);}
  .st:nth-child(4) .bar i{background:linear-gradient(90deg,#ff5252,#ffab91);}

  .panel{background:linear-gradient(160deg,rgba(23,31,62,.95),rgba(12,17,36,.96));
    border:1px solid var(--line);border-radius:20px;padding:26px;flex:1;
    display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.45);}
  .year{display:inline-block;font-size:11.5px;letter-spacing:3px;color:var(--gold2);
    border:1px solid var(--line);border-radius:16px;padding:2px 14px;margin-bottom:14px;background:rgba(245,197,66,.07);}
  .panel h3{font-size:clamp(19px,2.6vw,24px);letter-spacing:.06em;color:#fff;margin-bottom:10px;}
  .panel .story{color:#c6cee8;font-size:15px;}
  .panel .story em{color:var(--gold2);font-style:normal;}
  .choices{display:grid;gap:12px;margin-top:22px;}
  .choice{
    text-align:left;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.13);
    color:var(--text);padding:14px 18px;border-radius:12px;cursor:pointer;font-size:15px;
    transition:background .22s,border-color .22s,transform .22s;font-family:inherit;
  }
  .choice:hover{background:rgba(245,197,66,.1);border-color:rgba(245,197,66,.5);transform:translateX(4px);}
  .choice .tag{font-size:11px;color:var(--muted);margin-left:8px;}
  .feedback{margin-top:18px;padding:14px 18px;border-radius:12px;font-size:14.5px;
    background:rgba(77,208,225,.08);border:1px dashed rgba(77,208,225,.4);color:#cfeef2;}
  .feedback b{color:var(--gold2);}
  .feedback .d{font-size:12px;color:var(--muted);margin-top:6px;}
  .fb-delta{color:var(--gold2);font-weight:700;}

  /* 结算 */
  .end-card{text-align:center;padding:14px 6px;}
  .end-card .badge{display:inline-block;font-size:12px;letter-spacing:4px;color:#1a1300;
    background:var(--gold);border-radius:20px;padding:4px 18px;font-weight:800;}
  .end-card h2{font-size:clamp(28px,5vw,42px);letter-spacing:.1em;color:#fff;margin:16px 0 8px;}
  .end-card .why{color:#c6cee8;font-size:15px;max-width:620px;margin:0 auto;}
  .end-card .score{margin-top:20px;font-size:14px;color:var(--muted);letter-spacing:2px;}
  .end-card .score b{color:var(--gold2);font-size:26px;}
  .end-card .stats-final{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted);}
  .end-card .stats-final span b{color:#fff;}
  .again{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{font-family:inherit;font-size:14px;padding:11px 26px;border-radius:12px;cursor:pointer;
    border:1px solid var(--line);background:rgba(245,197,66,.1);color:var(--gold2);transition:.25s;}
  .btn:hover{background:rgba(245,197,66,.22);}
  .btn.ghost{background:transparent;color:var(--muted);border-color:rgba(255,255,255,.15);}

  .fade{animation:fadeIn .45s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (max-width:720px){
    .pick{grid-template-columns:1fr;max-width:340px;margin-left:auto;margin-right:auto;}
    .pick .card{flex-direction:row;text-align:left;align-items:center;}
    .pick .card img{width:84px;height:84px;flex:none;}
    .stats{grid-template-columns:1fr 1fr;}
    .topbar img{width:46px;height:46px;}
  }
</style>
</head>
<body>
<div class="shell">

  <!-- 开始 -->
  <div id="screen-start" class="fade">
    <div class="title-wrap">
      <div class="eyebrow">定 远 之 神</div>
      <h1 class="serif">人生模拟器</h1>
      <p class="sub">三人皆出自定远，一路读到县里最好的<b style="color:#ffe9a8">定远中学</b>。18 岁高考前，你会活成谁？</p>
    </div>
    <div class="pick" id="pick"></div>
    <p class="hint">选择一位主角开始 · 你的每个选择都会改变属性与结局</p>
  </div>

  <!-- 游戏 -->
  <div id="screen-game" style="display:none" class="fade">
    <div class="topbar">
      <img id="g-img" alt="">
      <div class="who">
        <h2 id="g-name"></h2>
        <p id="g-tag"></p>
      </div>
      <button class="quit" onclick="backToStart()">换人</button>
    </div>
    <div class="stats" id="g-stats"></div>
    <div class="panel">
      <span class="year" id="g-year"></span>
      <h3 id="g-title"></h3>
      <p class="story" id="g-story"></p>
      <div class="choices" id="g-choices"></div>
      <div class="feedback" id="g-feedback" style="display:none"></div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="screen-end" style="display:none" class="fade">
    <div class="panel">
      <div class="end-card">
        <span class="badge">18 岁 · 高考前</span>
        <h2 id="e-title"></h2>
        <p class="why" id="e-why"></p>
        <div class="score">人生总评 <b id="e-score"></b> 分</div>
        <div class="stats-final" id="e-stats"></div>
        <div class="again">
          <button class="btn" onclick="restart()">再活一次</button>
          <button class="btn ghost" onclick="backToStart()">换个人物</button>
        </div>
      </div>
    </div>
  </div>

</div>

    endings: [
      { test: s => s.aura >= 92, title: '定远传说', why: '你不需要说话，站在那儿就是定远中学的传说。连老师提起你，语气都会放轻。' },
      { test: s => s.fame >= 85, title: '校园霸主', why: '整个定远中学都知道你的名字。金龟见到你，还是会绕道。' },
      { test: s => s.study >= 82, title: '低调学神', why: '你收敛了气场，却考出了惊人的成绩。反差，才是最狠的拽。' },
      { test: s => s.happy >= 80, title: '松弛感大师', why: '别人紧张到失眠，你在考场外吃着早餐。这份从容，无人能及。' },
      { test: () => true, title: '收敛锋芒', why: '你没有掀起风浪，但也没人敢小看你。' }
    ]
  }
};

/* ============ 状态 ============ */
let cur = null;      // 当前角色 key
let st = {};         // 属性
let idx = 0;         // 事件下标

const $ = id => document.getElementById(id);

function show(id) {
  ['screen-start', 'screen-game', 'screen-end'].forEach(s => {
    $(s).style.display = (s === id) ? '' : 'none';
  });
}

function renderPick() {
  const box = $('pick');
  box.innerHTML = '';
  Object.entries(CHARS).forEach(([key, c]) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = '<img src="' + c.img + '" alt="' + c.name + '">' +
      '<div class="nm">' + c.name + '</div>' +
      '<div class="tg">' + c.tag.split(' · ')[0] + '</div>' +
      '<div class="sc">' + c.tag.split(' · ').slice(1).join(' · ') + '</div>';
    el.onclick = () => start(key);
    box.appendChild(el);
  });
}

function start(key) {
  cur = key;
  const c = CHARS[key];
  st = {};
  c.stats.forEach(s => { st[s.k] = s.v; });
  idx = 0;
  $('g-img').src = c.img;
  $('g-name').textContent = c.name;
  $('g-tag').textContent = c.tag;
  show('screen-game');
  renderStats();
  renderEvent();
}

function renderStats() {
  const c = CHARS[cur];
  $('g-stats').innerHTML = c.stats.map(s => {
    const v = Math.round(st[s.k]);
    return '<div class="st"><div class="row"><span>' + s.n + '</span><b>' + v + '</b></div>' +
      '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, v)) + '%"></i></div></div>';
  }).join('');
}

function renderEvent() {
  const c = CHARS[cur];
  const ev = c.events[idx];
  if (!ev) return finish();
  $('g-year').textContent = ev.year;
  $('g-title').textContent = ev.title;
  $('g-story').innerHTML = ev.story;
  $('g-feedback').style.display = 'none';
  const box = $('g-choices');
  box.innerHTML = '';
  ev.choices.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = ch.t;
    b.onclick = () => choose(ch);
    box.appendChild(b);
  });
  $('screen-game').classList.remove('fade');
  void $('screen-game').offsetWidth;
  $('screen-game').classList.add('fade');
}

function fmtDelta(eff) {
  const map = Object.fromEntries(Object.entries(CHARS[cur].stats).map(s => [s.k, s.n]));
  return Object.entries(eff).map(([k, d]) =>
    map[k] + '<span class="' + (d >= 0 ? '' : '') + '"> ' + (d >= 0 ? '+' : '') + d + '</span>'
  ).join(' · ');
}

function choose(ch) {
  const c = CHARS[cur];
  Object.entries(ch.eff).forEach(([k, d]) => {
    st[k] = Math.max(0, Math.min(100, st[k] + d));
  });
  renderStats();
  const fb = $('g-feedback');
  fb.style.display = 'block';
  fb.innerHTML = '<b>' + ch.fb + '</b><div class="d">' +
    Object.entries(ch.eff).map(([k, d]) => {
      const name = c.stats.find(s => s.k === k).n;
      return name + ' <span class="fb-delta">' + (d >= 0 ? '+' : '') + d + '</span>';
    }).join('　') + '</div>';

  // 禁用按钮，延迟进入下一事件
  [...$('g-choices').children].forEach(b => { b.disabled = true; b.style.opacity = .5; });
  setTimeout(() => {
    idx++;
    if (idx < c.events.length) renderEvent();
    else finish();
  }, 1300);
}

function finish() {
  const c = CHARS[cur];
  const score = Math.round(Object.values(st).reduce((a, b) => a + b, 0) / Object.keys(st).length);
  const ending = c.endings.find(e => e.test(st)) || c.endings[c.endings.length - 1];
  $('e-title').textContent = ending.title;
  $('e-why').textContent = ending.why;
  $('e-score').textContent = score;
  $('e-stats').innerHTML = c.stats.map(s => '<span>' + s.n + ' <b>' + Math.round(st[s.k]) + '</b></span>').join('');
  show('screen-end');
}

function restart() { if (cur) start(cur); }
function backToStart() { show('screen-start'); }

renderPick();
</script>
</body>
